<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Open‑Source Security Notice Tracker – Shepherd</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Open‑Source Security Notice Tracker – Shepherd</h1>
</header>

<main>
    <!-- ① Manual entry -->
    <section id="add-project">
        <h2>Add a project</h2>
        <form id="project-form">
            <input type="url" id="project-url"
                   placeholder="GitHub repo URL or any custom source"
                   required>
            <button type="submit">Add</button>
        </form>
    </section>

    <!-- ② Popular open‑source projects -->
    <section id="popular-projects">
        <h2>Popular projects</h2>
        <p>Select a project to add it to your stack:</p>
        <div class="grid">
            <button class="pop-btn" data-url="https://github.com/facebook/react">React</button>
            <button class="pop-btn" data-url="https://github.com/vuejs/vue">Vue.js</button>
            <button class="pop-btn" data-url="https://github.com/angular/angular">Angular</button>
            <button class="pop-btn" data-url="https://github.com/django/django">Django</button>
            <button class="pop-btn" data-url="https://github.com/pallets/flask">Flask</button>
            <button class="pop-btn" data-url="https://github.com/nodejs/node">Node.js</button>
            <button class="pop-btn" data-url="https://github.com/tensorflow/tensorflow">TensorFlow</button>
            <button class="pop-btn" data-url="https://github.com/apache/kafka">Apache Kafka</button>
        </div>
    </section>

    <!-- ③ GitHub search -->
    <section id="github-search">
        <h2>Search GitHub for projects</h2>
        <form id="gh-search-form">
            <input type="text" id="gh-query"
                   placeholder="Enter keywords, e.g. ‘markdown editor’"
                   required>
            <button type="submit">Search</button>
        </form>
        <ul id="gh-results"></ul>
    </section>

    <!-- ④ Tracked projects -->
    <section id="track-list">
        <h2>Tracked projects</h2>
        <ul id="projects"></ul>
    </section>

    <!-- ⑤ Vulnerability notices -->
    <section id="vuln-results">
        <h2>Vulnerability notices</h2>
        <button id="refresh-btn" disabled>Refresh</button>
        <div id="results">Select a project to view its notices.</div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
